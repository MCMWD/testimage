<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Image Viewer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    #topbar {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }

    #title {
      background: rgba(0,0,0,0.68);
      color: white;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
      max-width: min(70vw, 700px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: auto;
    }

    #status {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
      background: #111;
      box-sizing: border-box;
    }

    #status.show {
      display: flex;
    }

    #status .box {
      max-width: 760px;
      line-height: 1.5;
    }

    #status code {
      color: #ddd;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewer"></div>

    <div id="topbar">
      <div id="title">360 Image Viewer</div>
    </div>

    <div id="status">
      <div class="box" id="statusText"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js"
    }
  }
  </script>

  <script type="module">
    import { Viewer } from '@photo-sphere-viewer/core';

    const params = new URLSearchParams(window.location.search);
    const imageUrl = params.get('image');
    const titleParam = params.get('title');

    const titleEl = document.getElementById('title');
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('statusText');

    function showStatus(html) {
      statusTextEl.innerHTML = html;
      statusEl.classList.add('show');
    }

    if (!imageUrl) {
      showStatus(`
        <h2>No image specified</h2>
        <p>Add an <code>?image=</code> parameter to the URL.</p>
        <p>Example:</p>
        <code>index.html?image=https%3A%2F%2Fraw.githubusercontent.com%2FUSER%2FREPO%2Fmain%2Fimage.jpg</code>
      `);
    } else {
      let displayTitle = titleParam;

      if (!displayTitle) {
        try {
          const u = new URL(imageUrl);
          displayTitle = decodeURIComponent(u.pathname.split('/').pop() || '360 Image Viewer');
        } catch {
          displayTitle = '360 Image Viewer';
        }
      }

      titleEl.textContent = displayTitle;

      try {
        const viewer = new Viewer({
          container: document.getElementById('viewer'),
          panorama: imageUrl,
          navbar: [
            'zoom',
            'move',
            'download',
            'fullscreen'
          ],
          defaultZoomLvl: 40,
          touchmoveTwoFingers: false,
          mousewheelCtrlKey: false,
        });

        viewer.addEventListener('panorama-error', (e) => {
          console.error(e);
          showStatus(`
            <h2>Could not load panorama</h2>
            <p>The image URL may be inaccessible, blocked by CORS, or not a valid equirectangular panorama.</p>
            <p><code>${imageUrl.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></p>
          `);
        });
      } catch (err) {
        console.error(err);
        showStatus(`
          <h2>Viewer error</h2>
          <p>${String(err).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>
        `);
      }
    }
  </script>
</body>
</html>
